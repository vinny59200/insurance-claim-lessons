:var(--gold);letter-spacing:.1em}.openlabel{font-size:13px;font-weight:650;color:var(--muted)}.done{color:#426f44;font-size:13px;font-weight:700}.lessonbody{max-width:770px}.lead{font-size:19px;color:var(--muted);margin-bottom:26px}.concept{padding:19px 0;border-top:1px solid var(--line)}.concept p{margin:0}.panel{background:var(--white);padding:22px;border:1px solid var(--line);border-radius:var(--r);margin:24px 0}.panel h2{margin:0 0 10px;font-size:20px}.panel p:last-child{margin:0}.dev{background:#e9efe3;border-color:#b9ceb3}.quiz label{display:block;background:var(--paper);padding:10px 12px;margin:8px 0;border-radius:8px;cursor:pointer}.quiz input{margin-right:10px}.feedback{margin-top:12px;font-weight:600}.sources a{overflow-wrap:anywhere}.pager{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:30px 0}.lessonmeta{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 12px}.tag{border:1px solid var(--line);background:var(--sage);padding:3px 10px;border-radius:30px;font-size:12px;font-weight:650}.note{border-left:3px solid #a45b27;padding:10px 14px;color:var(--muted);font-size:14px;margin:20px 0}.glossary{display:grid;grid-template-columns:1fr 2fr;gap:0;border-top:1px solid var(--line)}.glossary dt,.glossary dd{margin:0;padding:10px;border-bottom:1px solid var(--line)}.glossary dt{font-weight:700}.skip{position:absolute;top:-100px;left:10px;background:white;color:var(--ink);padding:10px;z-index:50}.skip:focus{top:10px}footer{border-top:1px solid var(--line);padding:20px 0 0;margin-top:40px;color:var(--muted);font-size:13px}@media(max-width:800px){header{gap:10px;flex-wrap:wrap}.brand{font-size:14px}.menubtn{display:block;margin-left:auto}.search{order:3;flex:0 0 100%;max-width:none}.layout{display:block}aside{display:none;position:static;height:auto;max-height:65vh;border-right:0;border-bottom:1px solid var(--line)}aside.open{display:block}main{padding-top:20px}.step{grid-template-columns:38px minmax(0,1fr);gap:10px}.number{width:35px;height:35px 'use strict';
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),norm=s=>String(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase(),params=new URLSearchParams(location.search),mods=COURSES.map((m,i)=>({...m,i,lessons:m.lessons.map((l,j)=>({...l,j,mi:i,id:m.id+'/'+l.id}))})),all=mods.flatMap(m=>m.lessons),mu=m=>'index.html?module='+encodeURIComponent(m.id),lu=l=>mu(mods[l.mi])+'&lesson='+encodeURIComponent(l.id.split('/')[1]),gurl='index.html?glossaire=1',m=mods.find(x=>x.id===params.get('module')),l=m?.lessons.find(x=>x.id===m.id+'/'+params.get('lesson')),gloss=params.has('glossaire'),key='sinistres-academie-v1';let done=new Set();try{done=new Set(JSON.parse(localStorage.getItem(key)||'[]').filter(x=>all.some(a=>a.id===x)))}catch{}const save=()=>{try{localStorage.setItem(key,JSON.stringify([...done]))}catch{}};const n=i=>String(i+1).padStart(2,'0'),link=(url,t,active=false,cl='navlink')=>`<a class="${cl}" href="${url}"${active?' aria-current="page"':''}>${esc(t)}</a>`,progress=()=>`<div class="progress"><strong>${done.size} / ${all.length} leçons</strong><div class="track" role="progressbar" aria-label="Progression" aria-valuemin="0" aria-valuemax="${all.length}" aria-valuenow="${done.size}"><span style="width:${100*done.size/all.length}%"></span></div></div>`;function nav(){ $('#sidebar').innerHTML=progress()+`<nav><h2>Parcours</h2>${link('index.html','Accueil · Timeline',!m&&!gloss)}${mods.map(x=>link(mu(x),n(x.i)+' · '+x.short,m===x&&!l)+(m===x?`<div class="subnav">${x.lessons.map(y=>link(lu(y),(done.has(y.id)?'✓ ':'')+n(y.j)+' · '+y.title,l===y)).join('')}</div>`:'')).join('')}<h2>Ressources</h2>${link(gurl,'Glossaire A–Z',gloss)}<a class="navlink" href="https://github.com/vinny59200/insurance-claim-lessons">Code source ↗</a></nav>`}function footer(){return '<footer>Formation indépendante · France · Édition novembre 2026. Exemples fictifs, à visée pédagogique. Vérifier les textes, contrats et conventions en vigueur ; aucun conseil juridique ni procédure interne d’un assureur.</footer>'}function crumbs(){return `<nav class="crumb" aria-label="Fil d’Ariane">${link('index.html','Accueil',!m&&!gloss,'')}${m?' <span aria-hidden="true">›</span> '+link(mu(m),m.short,!l,''):''}${l?' <span aria-hidden="true">›</span> <span aria-current="page">'+esc(l.title)+'</span>':''}${gloss?' <span aria-hidden="true">›</span> <span aria-current="page">Glossaire</span>':''}</nav>`}const btn=(url,t,secondary=false)=>link(url,t,false,'btn'+(secondary?' secondary':''));function home(){const next=all.find(x=>!done.has(x.id))||all[0];return `<div class="hero"><div class="eyebrow">France · Assurance IARD · Culture métier</div><h1>Comprendre la gestion des sinistres.</h1><p>Du premier appel à la clôture : apprenez les concepts, la réglementation et les mécanismes financiers qui façonnent un dossier. Un parcours pensé aussi pour les équipes informatiques.</p>${btn(lu(next),done.size?'Reprendre le parcours →':'Commencer le cours →')}<div class="stats"><div><strong>${mods.length}</strong><small>modules</small></div><div><strong>${all.length}</strong><small>leçons & quiz</small></div><div><strong>100 %</strong><small>gratuit · sans compte</small></div></div></div><h2>La timeline du parcours</h2><p class="muted">Suivez les étapes dans l’ordre, ou explorez un thème librement. Les étapes opérationnelles peuvent se chevaucher ; les modules transversaux ne constituent pas des statuts obligatoires.</p><div class="timeline">${mods.map(x=>`<div class="step"><div class="rail"><span class="number">${n(x.i)}</span>${x.i<mods.length-1?'<span class="arrow" aria-hidden="true">↓</span>':''}</div><a class="stepcard" href="${mu(x)}"><div class="stephead"><h3>${esc(x.title)}</h3><span aria-hidden="true">→</span></div><p>${esc(x.desc)}</p><small>${x.lessons.filter(y=>done.has(y.id)).length} / ${x.lessons.length} leçons terminées</small></a></div>`).join('')}</div><div class="note">Repères : droit français, conventions interassureurs et modèle ClaimCenter standard. Aucune donnée ou règle interne d’entreprise.</div>`}function modpage(){return `<div class="eyebrow">Module ${n(m.i)} / ${mods.length}</div><h1>${esc(m.title)}</h1><p class="lead">${esc(m.desc)}</p><p class="muted">Survolez une carte ou placez-y le focus pour découvrir son résumé. Cliquez pour ouvrir la leçon. Sur mobile, le résumé est visible directement.</p><div class="cards">${m.lessons.map(x=>`<a class="flip" href="${lu(x)}" aria-label="Leçon ${n(x.j)} : ${esc(x.title)}. ${esc(x.summary)}"><div class="flipinner"><div class="flipface front"><div><div class="cardnum">LEÇON ${n(x.j)}</div><h3 style="margin-top:13px">${esc(x.title)}</h3><p class="touchsummary">${esc(x.summary)}</p></div><span class="${done.has(x.id)?'done':'openlabel'}">${done.has(x.id)?'✓ Terminée':'Ouvrir la leçon →'}</span></div><div class="flipface back" aria-hidden="true"><div><small>EN BREF</small><p>${esc(x.summary)}</p></div><strong>Lire la leçon →</strong></div></div></a>`).join('')}</div><div class="pager">${m.i?btn(mu(mods[m.i-1]),'← Module précédent',true):btn('index.html','← Timeline',true)}${m.i<mods.length-1?btn(mu(mods[m.i+1]),'Module suivant →'):btn(gurl,'Glossaire →')}</div>`}function lessonpage(){const i=all.indexOf(l);return `<article class="lessonbody"><div class="lessonmeta"><span class="tag">Module ${n(m.i)} · Leçon ${n(l.j)}</span><span class="tag">Lecture & quiz · 3–5 min</span></div><h1>${esc(l.title)}</h1><p class="lead">${esc(l.summary)}</p><h2>Les notions essentielles</h2>${l.concepts.map(([t,v])=>`<section class="concept"><h3>${esc(t)}</h3><p>${esc(v)}</p></section>`).join('')}<section class="panel"><h2>Cas pratique</h2><p>${esc(l.case)}</p></section><section class="panel dev"><h2>Le réflexe développeur</h2><p>${esc(l.dev)}</p></section><section class="panel quiz"><h2>Vérifiez vos acquis</h2><form id="quiz"><fieldset style="border:0;padding:0;margin:0"><legend>${esc(l.q)}</legend>${l.opts.map((o,j)=>`<label><input type="radio" name="answer" value="${j}" required>${esc(o)}</label>`).join('')}</fieldset><button class="btn secondary" type="submit">Vérifier</button><div class="feedback" id="feedback" role="status"></div></form></section><section class="sources"><h2>Références et approfondissement</h2><ul>${l.refs.map(r=>`<li><a href="${esc(SOURCES[r][1])}" target="_blank" rel="noopener noreferrer">${esc(SOURCES[r][0])} ↗</a></li>`).join('')}</ul></section><button id="complete" class="btn" aria-pressed="${done.has(l.id)}">${done.has(l.id)?'✓ Leçon terminée · annuler':'✓ Marquer comme terminée'}</button><div class="pager">${i?btn(lu(all[i-1]),'← Leçon précédente',true):btn(mu(m),'← Module',true)}${i<all.length-1?btn(lu(all[i+1]),'Leçon suivante →'):btn('index.html','Retour à la timeline →')}</div></article>`}function glossary(){return `<div class="eyebrow">Référence rapide</div><h1>Glossaire métier</h1><p class="lead">Les acronymes et les principaux mots du quotidien.</p><dl class="glossary">${Object.entries(GLOSSARY).sort(([a],[b])=>a.localeCompare(b,'fr')).map(([t,v])=>`<dt>${esc(t)}</dt><dd>${esc(v)}</dd>`).join('')}</dl>`}function render(){nav();const bad=params.has('module')&&!m||params.has('lesson')&&!l;$('#main').innerHTML=crumbs()+(bad?'<h1>Page introuvable</h1><p><a href="index.html">Revenir au parcours</a></p>':gloss?glossary():l?lessonpage():m?modpage():home())+footer();document.title=(l?.title||m?.title||(gloss?'Glossaire':'Comprendre la gestion des sinistres'))+' · Sinistres Académie';if(l&&!bad&&!gloss){$('#quiz').addEventListener('submit',e=>{e.preventDefault();const v=Number(new FormData(e.target).get('answer'));$('#feedback').textContent=(v===l.correct?'Bonne réponse ! ':'À revoir. ')+l.why});$('#complete').onclick=()=>{done.has(l.id)?done.delete(l.id):done.add(l.id);save();nav();$('#complete').setAttribute('aria-pressed',done.has(l.id));$('#complete').textContent=done.has(l.id)?'✓ Leçon terminée · annuler':'✓ Marquer comme terminée'}}}r </script></body></html>
